name: Build Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Validate project
        run: npm run check
      - name: Build portable EXE
        run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Reino-de-Valdemar-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
